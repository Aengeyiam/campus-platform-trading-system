<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 校园二手交易与失物招领</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<div class="auth-wrap">
  <div class="auth-container">
    <div class="auth-brand">
      <span class="brand-mark">🏫</span>
      <h4 class="fw-bold mb-1">校园集市</h4>
      <div class="text-muted small">闲置交易 · 失物招领 · 温暖校园</div>
    </div>
    <div class="card auth-card">
      <div class="card-body p-4 p-md-5">
        <h5 class="card-title mb-4 fw-bold">欢迎回来 👋</h5>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">学号</label>
            <input type="text" name="student_id" class="form-control" required placeholder="请输入学号">
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required placeholder="请输入密码">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">登录</button>
        </form>
        <p class="text-center mt-4 mb-0"><small>还没有账号？<a href="/register.html" class="fw-semibold">立即注册</a></small></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "登录中...";

  const student_id = e.target.student_id.value.trim();
  const password = e.target.password.value.trim();

  if (!student_id || !password) {
    showToast("请输入学号和密码", "error");
    btn.disabled = false; btn.textContent = "登录";
    return;
  }

  const res = await API.post("/api/auth/login", { student_id, password });
  if (res.code === 200) {
    localStorage.setItem("campus_token", res.data.token);
    localStorage.setItem("campus_user", JSON.stringify(res.data));
    showToast("登录成功");

    setTimeout(() => {
      if (res.data.role === "管理员") {
        window.location.href = "/admin/statistics.html";
      } else {
        window.location.href = "/index.html";
      }
    }, 500);
  } else {
    showToast(res.msg || "登录失败", "error");
    btn.disabled = false; btn.textContent = "登录";
  }
});
</script>
</body>
</html>
