<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布商品 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4" style="max-width:680px">
  <h4 class="page-header">发布二手商品</h4>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form id="publishForm">
        <div class="mb-3">
          <label class="form-label">商品标题 <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" required maxlength="100">
        </div>
        <div class="mb-3">
          <label class="form-label">商品描述 <span class="text-danger">*</span></label>
          <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">售价 (元) <span class="text-danger">*</span></label>
            <input type="number" name="price" class="form-control" step="0.01" min="0.01" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">原价 (元)</label>
            <input type="number" name="original_price" class="form-control" step="0.01" min="0">
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">分类 <span class="text-danger">*</span></label>
            <select name="category_id" class="form-select" required id="categorySelect">
              <option value="">请选择</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">新旧程度 <span class="text-danger">*</span></label>
            <select name="condition" class="form-select" required>
              <option value="">请选择</option>
              <option>全新</option><option>几乎全新</option><option>轻微使用</option><option>正常使用</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">提交审核</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
async function loadCategories() {
  const res = await API.get("/api/products/categories");
  if (res.code === 200) {
    const sel = document.getElementById("categorySelect");
    res.data.forEach(c => {
      sel.innerHTML += `<option value="${c.category_id}">${c.category_name}</option>`;
    });
  }
}

document.getElementById("publishForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!API.user()) { showToast("请先登录", "error"); return; }
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "提交中...";

  const data = {
    title: e.target.title.value.trim(),
    description: e.target.description.value.trim(),
    price: parseFloat(e.target.price.value),
    original_price: e.target.original_price.value ? parseFloat(e.target.original_price.value) : null,
    category_id: parseInt(e.target.category_id.value),
    condition: e.target.condition.value,
  };

  const res = await API.post("/api/products", data);
  if (res.code === 200) {
    showToast("发布成功，等待管理员审核");
    setTimeout(() => window.location.href = "/index.html", 800);
  } else {
    showToast(res.msg, "error");
  }
  btn.disabled = false; btn.textContent = "提交审核";
});

document.addEventListener("DOMContentLoaded", loadCategories);
</script>
</body>
</html>
