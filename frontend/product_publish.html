<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布商品 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4" style="max-width:680px">
  <a href="/index.html" class="btn btn-outline-secondary btn-sm">&larr; 返回首页</a>
  <h4 class="page-header">发布二手商品</h4>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form id="publishForm">
        <div class="mb-3">
          <label class="form-label">商品标题 <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" required maxlength="100">
        </div>
        <div class="mb-3">
          <label class="form-label">商品描述 <span class="text-danger">*</span></label>
          <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">售价 (元) <span class="text-danger">*</span></label>
            <input type="number" name="price" class="form-control" step="0.01" min="0.01" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">原价 (元)</label>
            <input type="number" name="original_price" class="form-control" step="0.01" min="0">
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">分类 <span class="text-danger">*</span></label>
            <select name="category_id" class="form-select" required id="categorySelect">
              <option value="">请选择</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">新旧程度 <span class="text-danger">*</span></label>
            <select name="condition" class="form-select" required>
              <option value="">请选择</option>
              <option>全新</option><option>几乎全新</option><option>轻微使用</option><option>正常使用</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">商品图片 <span class="text-muted small">（最多 5 张，第一张为封面）</span></label>
          <input type="file" id="imageInput" class="form-control" accept=".jpg,.jpeg,.png,.gif,.webp" multiple>
          <div class="d-flex flex-wrap gap-2 mt-2" id="imagePreview"></div>
          <div class="form-text">支持 jpg / png / gif / webp，单张不超过 16MB</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">提交审核</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
const MAX_IMAGES = 5;
let uploadedImages = [];   // 已上传成功的图片 URL 列表
let uploading = false;     // 是否正在上传

async function loadCategories() {
  const sel = document.getElementById("categorySelect");
  const res = await API.get("/api/products/categories");
  if (res.code === 200 && res.data && res.data.length > 0) {
    res.data.forEach(c => {
      sel.innerHTML += `<option value="${c.category_id}">${c.category_name}</option>`;
    });
  } else {
    // 分类加载失败/为空：给出可操作提示，避免出现"无选项"的空下拉
    sel.innerHTML = res.code === 200
      ? '<option value="">暂无分类，请联系管理员初始化</option>'
      : `<option value="">分类加载失败</option>`;
    showToast(res.code === 200 ? "暂无商品分类" : "分类加载失败，请检查后端或数据库", "error");
  }
}

/* ========== 图片选择与上传 ========== */
document.getElementById("imageInput").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  if (!API.user()) { showToast("请先登录", "error"); return; }

  const remain = MAX_IMAGES - uploadedImages.length;
  if (remain <= 0) { showToast(`最多上传 ${MAX_IMAGES} 张图片`, "error"); return; }
  const chosen = files.slice(0, remain);
  e.target.value = "";

  for (const file of chosen) {
    if (file.size > 16 * 1024 * 1024) { showToast(`${file.name} 超过 16MB，已跳过`, "error"); continue; }
    if (uploading) return;

    uploading = true;
    const fd = new FormData();
    fd.append("file", file);
    try {
      const res = await fetch("/api/products/upload", {
        method: "POST",
        headers: { Authorization: "Bearer " + API.token() },
        body: fd,
      }).then(r => r.json());

      if (res.code === 200) {
        uploadedImages.push(res.data.url);
        renderPreview();
      } else {
        showToast(res.msg || "上传失败", "error");
      }
    } catch (err) {
      showToast("上传失败，请重试", "error");
    } finally {
      uploading = false;
    }
  }
});

/* 渲染缩略图预览（第一张标记为封面） */
function renderPreview() {
  const box = document.getElementById("imagePreview");
  box.innerHTML = uploadedImages.map((url, i) => `
    <div class="position-relative" style="width:80px;height:80px">
      <img src="${url}" class="rounded border w-100 h-100" style="object-fit:cover" alt="图片${i + 1}">
      ${i === 0 ? '<span class="badge text-bg-primary position-absolute top-0 start-0" style="font-size:10px">封面</span>' : ''}
      <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 bg-danger rounded-circle p-1"
              style="font-size:10px" onclick="removeImage(${i})" aria-label="删除"></button>
    </div>`).join("");
}

function removeImage(i) {
  uploadedImages.splice(i, 1);
  renderPreview();
}

document.getElementById("publishForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!API.user()) { showToast("请先登录", "error"); return; }
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "提交中...";

  const data = {
    title: e.target.title.value.trim(),
    description: e.target.description.value.trim(),
    price: parseFloat(e.target.price.value),
    original_price: e.target.original_price.value ? parseFloat(e.target.original_price.value) : null,
    category_id: parseInt(e.target.category_id.value),
    condition: e.target.condition.value,
    images: uploadedImages,
  };

  const res = await API.post("/api/products", data);
  if (res.code === 200) {
    showToast("发布成功，等待管理员审核");
    setTimeout(() => window.location.href = "/index.html", 800);
  } else {
    showToast(res.msg, "error");
  }
  btn.disabled = false; btn.textContent = "提交审核";
});

document.addEventListener("DOMContentLoaded", () => {
  // 发布商品需登录：未登录跳转登录页
  if (!API.user()) {
    showToast("请先登录", "error");
    setTimeout(() => window.location.href = "/login.html", 600);
    return;
  }
  loadCategories();
});
</script>
</body>
</html>
