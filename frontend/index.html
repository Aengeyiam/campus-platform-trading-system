<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - 校园二手交易与失物招领</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4">
  <!-- 搜索栏 -->
  <div class="row mb-4">
    <div class="col-md-8 mx-auto">
      <div class="input-group input-group-lg shadow-sm">
        <input type="text" id="searchInput" class="form-control" placeholder="搜索商品...">
        <button class="btn btn-primary" onclick="searchProducts()">搜索</button>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- 分类侧边栏 -->
    <div class="col-md-2">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">商品分类</div>
        <div class="list-group list-group-flush" id="categoryList">
          <a href="#" class="list-group-item list-group-item-action active" data-cid="">全部</a>
        </div>
      </div>
    </div>

    <!-- 商品列表 -->
    <div class="col-md-10">
      <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3" id="productList"></div>
      <div class="text-center mt-4" id="pagination"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
let currentCategory = "";
let currentPage = 1;

async function loadCategories() {
  const res = await API.get("/api/products/categories");
  if (res.code === 200) {
    const list = document.getElementById("categoryList");
    res.data.forEach(c => {
      const a = document.createElement("a");
      a.href = "#";
      a.className = "list-group-item list-group-item-action";
      a.dataset.cid = c.category_id;
      a.textContent = c.category_name;
      a.onclick = (e) => { e.preventDefault(); switchCategory(c.category_id, a); };
      list.appendChild(a);
    });
  }
}

function switchCategory(cid, el) {
  currentCategory = cid;
  currentPage = 1;
  document.querySelectorAll("#categoryList a").forEach(a => a.classList.remove("active"));
  el.classList.add("active");
  loadProducts();
}

async function loadProducts() {
  const params = { page: currentPage, size: 12 };
  if (currentCategory) params.category_id = currentCategory;
  const kw = document.getElementById("searchInput").value.trim();
  if (kw) params.keyword = kw;

  const res = await API.get("/api/products", params);
  const container = document.getElementById("productList");
  if (res.code === 200 && res.data.items.length > 0) {
    container.innerHTML = res.data.items.map(renderProductCard).join("");
  } else {
    container.innerHTML = `<div class="col-12 empty-state">暂无商品</div>`;
  }

  // 简单分页
  const pg = document.getElementById("pagination");
  if (res.data && res.data.total > res.data.size) {
    const pages = Math.ceil(res.data.total / res.data.size);
    let html = '<div class="btn-group">';
    for (let i = 1; i <= Math.min(pages, 10); i++) {
      html += `<button class="btn ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'} btn-sm" onclick="goPage(${i})">${i}</button>`;
    }
    html += '</div>';
    pg.innerHTML = html;
  } else {
    pg.innerHTML = "";
  }
}

function goPage(p) { currentPage = p; loadProducts(); }
function searchProducts() { currentPage = 1; loadProducts(); }

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchProducts();
});

document.addEventListener("DOMContentLoaded", () => {
  loadCategories();
  loadProducts();
});
</script>
</body>
</html>
