<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - 校园二手交易与失物招领</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4">
  <!-- 顶部横幅 -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="bg-primary text-white rounded-3 p-4 shadow-sm d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <h4 class="mb-1 fw-bold">校园二手交易与失物招领</h4>
          <div class="opacity-75">闲置再利用 · 绿色环保 · 校园专属交易平台</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a href="/product_publish.html" class="btn btn-light fw-semibold">发布闲置</a>
          <a href="/lost_found.html" class="btn btn-outline-light">失物招领</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 我的快捷入口（登录后显示） -->
  <div class="row mb-3" id="quickLinks" style="display:none">
    <div class="col-12">
      <a class="btn btn-outline-primary btn-sm me-2" href="/my_publish.html">我的发布</a>
      <a class="btn btn-outline-primary btn-sm me-2" href="/my_favorites.html">我的收藏</a>
      <a class="btn btn-outline-primary btn-sm" href="/my_orders.html">我的订单</a>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="row mb-4">
    <div class="col-md-8 mx-auto">
      <div class="input-group input-group-lg shadow-sm">
        <input type="text" id="searchInput" class="form-control" placeholder="搜索商品...">
        <button class="btn btn-primary" onclick="searchProducts()">搜索</button>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- 分类侧边栏 -->
    <div class="col-md-2">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">商品分类</div>
        <div class="list-group list-group-flush" id="categoryList">
          <a href="#" class="list-group-item list-group-item-action active" data-cid="">全部</a>
        </div>
      </div>
    </div>

    <!-- 商品列表 -->
    <div class="col-md-10">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted" id="productCount"></span>
      </div>
      <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3" id="productList"></div>
      <div class="text-center mt-4" id="pagination"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
let currentCategory = "";
let currentPage = 1;

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function renderProductCardSafe(p) {
  const cover = escapeHtml(p.cover_image || "");
  return `
    <div class="col">
      <div class="card h-100 shadow-sm product-card" onclick="location.href='/product_detail.html?id=${p.product_id}'" style="cursor:pointer">
        ${cover ? `<img src="${cover}" class="card-img-top" style="height:200px;object-fit:cover" alt="${escapeHtml(p.title)}">` : `<div class="card-img-top bg-light d-flex align-items-center justify-content-center text-muted" style="height:200px">暂无图片</div>`}
        <div class="card-body">
          <h6 class="card-title text-truncate">${escapeHtml(p.title)}</h6>
          <p class="card-text">
            <span class="text-danger fw-bold fs-5">¥${Number(p.price).toFixed(2)}</span>
            <small class="text-muted ms-2">${escapeHtml(p.condition || "")}</small>
          </p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between">
          <small class="text-muted">${escapeHtml(p.seller_name || "")}</small>
          <small>信用: <span class="text-success">${Number(p.seller_credit ?? 100)}</span></small>
        </div>
      </div>
    </div>`;
}

async function loadCategories() {
  const list = document.getElementById("categoryList");
  const res = await API.get("/api/products/categories");
  if (res.code === 200 && res.data && res.data.length > 0) {
    const childrenByParent = new Map();
    res.data.forEach(c => {
      if (!c.parent_id) return;
      if (!childrenByParent.has(c.parent_id)) childrenByParent.set(c.parent_id, []);
      childrenByParent.get(c.parent_id).push(c);
    });

    res.data.filter(c => !c.parent_id).forEach(parent => {
      const link = document.createElement("a");
      link.href = "#";
      link.className = "list-group-item list-group-item-action";
      link.dataset.cid = parent.category_id;
      link.textContent = parent.category_name;
      link.onclick = (e) => { e.preventDefault(); switchCategory(parent.category_id, link); };
      list.appendChild(link);

      (childrenByParent.get(parent.category_id) || []).forEach(child => {
        const childLink = document.createElement("a");
        childLink.href = "#";
        childLink.className = "list-group-item list-group-item-action ps-4 small";
        childLink.dataset.cid = child.category_id;
        childLink.textContent = child.category_name;
        childLink.onclick = (e) => { e.preventDefault(); switchCategory(child.category_id, childLink); };
        list.appendChild(childLink);
      });
    });
  } else {
    // 分类加载失败/为空：给出可操作提示
    const tip = document.createElement("div");
    tip.className = "list-group-item text-muted small";
    tip.textContent = res.code === 200 ? "暂无分类" : "分类加载失败，请检查后端或数据库";
    list.appendChild(tip);
  }
}

function switchCategory(cid, el) {
  currentCategory = cid;
  currentPage = 1;
  document.querySelectorAll("#categoryList a").forEach(a => a.classList.remove("active"));
  el.classList.add("active");
  loadProducts();
}

async function loadProducts() {
  const params = { page: currentPage, size: 12 };
  if (currentCategory) params.category_id = currentCategory;
  const kw = document.getElementById("searchInput").value.trim();
  if (kw) params.keyword = kw;

  const container = document.getElementById("productList");
  const countEl = document.getElementById("productCount");
  const res = await API.get("/api/products", params);

  if (res.code !== 200) {
    container.innerHTML = `<div class="col-12 empty-state">商品加载失败：${res.msg || "请稍后重试"}</div>`;
    countEl.textContent = "";
    document.getElementById("pagination").innerHTML = "";
    return;
  }

  countEl.textContent = `共 ${res.data.total} 件商品`;
  if (res.data.items.length > 0) {
    container.innerHTML = res.data.items.map(renderProductCardSafe).join("");
  } else {
    container.innerHTML = `<div class="col-12 empty-state">暂无商品，去发布第一件闲置吧</div>`;
  }

  // 分页：上一页/下一页 + 页码按钮
  const pg = document.getElementById("pagination");
  if (res.data.total > res.data.size) {
    const pages = Math.ceil(res.data.total / res.data.size);
    let html = '<nav><ul class="pagination pagination-sm justify-content-center mb-0">';
    html += `<li class="page-item ${currentPage <= 1 ? 'disabled' : ''}">
               <a class="page-link" href="#" onclick="goPage(${currentPage - 1});return false;">上一页</a></li>`;

    // 最多显示 10 个页码，当前页居中
    let start = Math.max(1, currentPage - 4);
    let end = Math.min(pages, start + 9);
    start = Math.max(1, end - 9);
    for (let i = start; i <= end; i++) {
      html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                 <a class="page-link" href="#" onclick="goPage(${i});return false;">${i}</a></li>`;
    }

    html += `<li class="page-item ${currentPage >= pages ? 'disabled' : ''}">
               <a class="page-link" href="#" onclick="goPage(${currentPage + 1});return false;">下一页</a></li>`;
    html += '</ul></nav>';
    pg.innerHTML = html;
  } else {
    pg.innerHTML = "";
  }
}

function goPage(p) { currentPage = p; loadProducts(); }
function searchProducts() { currentPage = 1; loadProducts(); }

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchProducts();
});

document.addEventListener("DOMContentLoaded", () => {
  // 登录后显示"我的发布/我的收藏/我的订单"快捷入口
  if (API.user()) document.getElementById("quickLinks").style.display = "block";
  loadCategories();
  loadProducts();
});
</script>
</body>
</html>
