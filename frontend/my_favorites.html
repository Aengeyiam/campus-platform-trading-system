<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="/index.html" class="btn btn-outline-secondary btn-sm">&larr; 返回首页</a>
    <h4 class="page-header mb-0">我的收藏</h4>
  </div>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="favoriteList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

async function loadFavorites() {
  if (!API.user()) { showToast("请先登录", "error"); setTimeout(() => window.location.href="/login.html", 600); return; }

  const container = document.getElementById("favoriteList");
  const res = await API.get("/api/products/favorites");

  if (res.code !== 200) {
    container.innerHTML = `<div class="col-12 empty-state">加载失败：${res.msg || "请稍后重试"}</div>`;
    return;
  }
  if (res.data.length === 0) {
    container.innerHTML = `<div class="col-12 empty-state">
      还没有收藏任何商品<br><a href="/index.html" class="btn btn-primary mt-3">去逛逛</a></div>`;
    return;
  }

  container.innerHTML = res.data.map(p => {
    const cover = escapeHtml(p.cover_image || "");
    return `
    <div class="col">
      <div class="card h-100 shadow-sm">
        ${cover ? `<img src="${cover}" class="card-img-top" style="height:160px;object-fit:cover;cursor:pointer"
             alt="${escapeHtml(p.title)}" onclick="location.href='/product_detail.html?id=${p.product_id}'">` : `<div class="card-img-top bg-light d-flex align-items-center justify-content-center text-muted" style="height:160px">暂无图片</div>`}
        <div class="card-body">
          <h6 class="card-title text-truncate" style="cursor:pointer" onclick="location.href='/product_detail.html?id=${p.product_id}'">${escapeHtml(p.title)}</h6>
          <p class="card-text">
            <span class="text-danger fw-bold">¥${Number(p.price).toFixed(2)}</span>
            <span class="status-badge status-${escapeHtml(p.status)} ms-2">${escapeHtml(p.status)}</span>
            <a href="/user_profile.html?id=${p.seller_id}" class="seller-link ms-2 small">${escapeHtml(p.seller_name || '')}</a>
          </p>
        </div>
        <div class="card-footer bg-white text-end">
          <button class="btn btn-outline-danger btn-sm" onclick="unfavorite(${p.product_id})">取消收藏</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

async function unfavorite(pid) {
  const res = await API.post(`/api/products/${pid}/favorite`);
  showToast(res.msg || "已取消收藏", res.code === 200 ? "success" : "error");
  if (res.code === 200) loadFavorites();
}

document.addEventListener("DOMContentLoaded", loadFavorites);
</script>
</body>
</html>
