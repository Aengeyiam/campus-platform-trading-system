<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失物招领 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-header mb-0">失物招领</h4>
    <a href="#" class="btn btn-primary btn-sm" onclick="showPublishForm()">发布信息</a>
  </div>

  <ul class="nav nav-tabs mb-3" id="lfTabs">
    <li class="nav-item"><a class="nav-link active" href="#" data-type="">全部</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-type="失物">失物</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-type="拾物">拾物</a></li>
  </ul>

  <div class="input-group mb-3">
    <input type="text" id="lfSearch" class="form-control" placeholder="搜索失物/拾物信息...">
    <button class="btn btn-outline-primary" onclick="loadList()">搜索</button>
  </div>

  <div id="lfList"></div>
</div>

<!-- 发布模态框 -->
<div class="modal fade" id="publishModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">发布失物 / 拾物信息</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="lfForm">
          <div class="mb-3">
            <label class="form-label">类型 <span class="text-danger">*</span></label>
            <select name="type" class="form-select" required><option value="">请选择</option><option>失物</option><option>拾物</option></select>
          </div>
          <div class="mb-3"><label class="form-label">标题 <span class="text-danger">*</span></label><input type="text" name="title" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">描述 <span class="text-danger">*</span></label><textarea name="description" class="form-control" rows="3" required></textarea></div>
          <div class="mb-3"><label class="form-label">地点 <span class="text-danger">*</span></label><input type="text" name="location" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">日期 <span class="text-danger">*</span></label><input type="date" name="lf_date" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">联系方式 <span class="text-danger">*</span></label><input type="text" name="contact" class="form-control" required></div>
          <button type="submit" class="btn btn-primary w-100">发布</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
let currentType = "";

function showPublishForm() {
  if (!API.user()) { showToast("请先登录", "error"); return; }
  new bootstrap.Modal(document.getElementById("publishModal")).show();
}

async function loadList() {
  const params = {};
  if (currentType) params.type = currentType;
  const kw = document.getElementById("lfSearch").value.trim();
  if (kw) params.keyword = kw;

  const res = await API.get("/api/lostfound", params);
  const container = document.getElementById("lfList");
  if (res.code !== 200 || !res.data.items.length) {
    container.innerHTML = '<div class="empty-state">暂无信息</div>';
    return;
  }

  container.innerHTML = res.data.items.map(lf => `
    <div class="card shadow-sm mb-2">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <span class="badge ${lf.type === '失物' ? 'bg-danger' : 'bg-success'} me-2">${lf.type}</span>
          <strong>${lf.title}</strong>
          <div class="text-muted small mt-1">
            ${lf.location} &nbsp;|&nbsp; ${lf.lf_date}
            &nbsp;|&nbsp; 发布者: <a href="/user_profile.html?id=${lf.publisher_id}" class="seller-link">${lf.publisher_name}</a>
            &nbsp;|&nbsp; <span class="status-badge status-${lf.status}">${lf.status}</span>
          </div>
        </div>
        <button class="btn btn-outline-primary btn-sm" onclick="claim(${lf.lf_id}, '${lf.title}')">认领</button>
      </div>
    </div>
  `).join("");
}

async function claim(lf_id, title) {
  if (!API.user()) { showToast("请先登录", "error"); return; }
  const desc = prompt(`认领"${title}"\n请描述物品特征作为证明：`);
  if (!desc) return;
  const res = await API.post("/api/lostfound/claims", { lf_id, description: desc });
  showToast(res.msg, res.code === 200 ? "success" : "error");
}

document.querySelectorAll("#lfTabs a").forEach(a => {
  a.addEventListener("click", (e) => {
    e.preventDefault();
    document.querySelectorAll("#lfTabs a").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    currentType = a.dataset.type;
    loadList();
  });
});

document.getElementById("lfForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "发布中...";
  const data = Object.fromEntries(new FormData(e.target));
  const res = await API.post("/api/lostfound", data);
  if (res.code === 200) {
    showToast("发布成功");
    bootstrap.Modal.getInstance(document.getElementById("publishModal")).hide();
    e.target.reset();
    loadList();
  } else {
    showToast(res.msg, "error");
  }
  btn.disabled = false; btn.textContent = "发布";
});

document.addEventListener("DOMContentLoaded", loadList);
</script>
</body>
</html>
