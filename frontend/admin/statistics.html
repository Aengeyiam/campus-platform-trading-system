<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 数据统计</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<div class="container-fluid">
  <div class="row">
    <!-- 侧边栏 -->
    <div class="col-md-2 admin-sidebar p-3">
      <h5 class="mb-3">管理后台</h5>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="/admin/statistics.html">数据统计</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/product_audit.html">商品审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/claim_audit.html">认领审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/user_manage.html">用户管理</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/logs.html">审核日志</a></li>
        <li class="nav-item mt-3"><a class="nav-link text-danger" href="/index.html">返回前台</a></li>
      </ul>
    </div>

    <!-- 主内容 -->
    <div class="col-md-10 p-4">
      <h4 class="page-header">数据统计面板</h4>

      <div class="row g-3 mb-4" id="summaryCards"></div>

      <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">商品分类统计</div>
        <div class="card-body"><table class="table table-sm" id="productStatsTable"></table></div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">信用分排行 Top 20</div>
        <div class="card-body"><table class="table table-sm" id="creditRankingTable"></table></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadStats() {
  // 商品统计
  const ps = await API.get("/api/stats/products");
  if (ps.code === 200) {
    const rows = ps.data.map(r => `
      <tr><td>${r.category_name}</td><td>${r.total_count}</td>
          <td>${r.active_count}</td><td>${r.sold_count}</td>
          <td>¥${Number(r.avg_price||0).toFixed(2)}</td><td>¥${Number(r.total_sales||0).toFixed(2)}</td></tr>
    `).join("");
    document.getElementById("productStatsTable").innerHTML = `
      <thead><tr><th>分类</th><th>总数</th><th>在售</th><th>已售</th><th>均价</th><th>销售额</th></tr></thead><tbody>${rows}</tbody>`;
  }

  // 信用排行
  const cr = await API.get("/api/stats/credits");
  if (cr.code === 200) {
    const rows = cr.data.slice(0, 20).map((r, i) => `
      <tr><td>${i+1}</td><td>${r.student_id}</td><td>${r.user_name}</td>
          <td class="fw-bold text-success">${r.credit_score}</td>
          <td>${r.trade_count}</td><td>${r.good_rate}%</td></tr>
    `).join("");
    document.getElementById("creditRankingTable").innerHTML = `
      <thead><tr><th>#</th><th>学号</th><th>姓名</th><th>信用分</th><th>交易次数</th><th>好评率</th></tr></thead><tbody>${rows}</tbody>`;
  }

  // 概览卡片
  const os = await API.get("/api/stats/orders");
  const lf = await API.get("/api/stats/lostfound");
  let totalAmount = 0, totalOrders = 0;
  if (os.code === 200 && os.data.length) {
    os.data.forEach(o => { totalAmount += Number(o.total_amount); totalOrders += o.total_orders; });
  }
  document.getElementById("summaryCards").innerHTML = `
    <div class="col-md-3"><div class="stat-card"><div class="text-muted small">总交易笔数</div><div class="fs-4 fw-bold">${totalOrders}</div></div></div>
    <div class="col-md-3"><div class="stat-card"><div class="text-muted small">总交易金额</div><div class="fs-4 fw-bold">¥${totalAmount.toFixed(2)}</div></div></div>
    <div class="col-md-3"><div class="stat-card"><div class="text-muted small">总用户数</div><div class="fs-4 fw-bold" id="userCount">-</div></div></div>
    <div class="col-md-3"><div class="stat-card"><div class="text-muted small">待审核商品</div><div class="fs-4 fw-bold text-warning" id="pendingCount">-</div></div></div>`;

  // 额外数据
  const uc = await API.get("/api/admin/users");
  if (uc.code === 200) document.getElementById("userCount").textContent = uc.data.length;
  const pc = await API.get("/api/admin/products/pending");
  if (pc.code === 200) document.getElementById("pendingCount").textContent = pc.data.length;
}

document.addEventListener("DOMContentLoaded", () => {
  if (!API.user() || API.user().role !== "管理员") {
    window.location.href = "/login.html";
    return;
  }
  loadStats();
});
</script>
</body>
</html>
