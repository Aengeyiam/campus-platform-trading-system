<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 认领审核</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div class="container-fluid"><div class="row">
<div class="col-md-2 admin-sidebar p-3">
  <h5 class="mb-3">管理后台</h5>
  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="/admin/statistics.html">数据统计</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/product_audit.html">商品审核</a></li>
    <li class="nav-item"><a class="nav-link active" href="/admin/claim_audit.html">认领审核</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/user_manage.html">用户管理</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/reports.html">举报管理</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/logs.html">审核日志</a></li>
    <li class="nav-item mt-3"><a class="nav-link text-danger" href="/index.html">返回前台</a></li>
  </ul>
</div>
<div class="col-md-10 p-4">
  <h4 class="page-header">认领审核</h4>
  <div id="pendingList"></div>
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadPending() {
  const res = await API.get("/api/admin/claims/pending");
  const container = document.getElementById("pendingList");
  if (res.code !== 200 || !res.data.length) {
    container.innerHTML = '<div class="empty-state">暂无待审核认领申请</div>';
    return;
  }
  container.innerHTML = res.data.map(c => `
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5>${c.lf_title} <span class="badge ${c.lf_type==='失物'?'bg-danger':'bg-success'}">${c.lf_type}</span></h5>
        <p class="text-muted">申请人: ${c.claimant_name} | 申请时间: ${new Date(c.created_at).toLocaleString()}</p>
        <p><strong>申请说明：</strong>${c.description}</p>
        <div class="d-flex gap-2">
          <button class="btn btn-success btn-sm" onclick="audit(${c.claim_id},'通过')">通过</button>
          <button class="btn btn-danger btn-sm" onclick="auditWithReason(${c.claim_id})">拒绝</button>
        </div>
      </div>
    </div>
  `).join("");
}

async function audit(cid, result) {
  const remark = result === "拒绝" ? (prompt("拒绝原因：") || "") : "";
  if (result === "拒绝" && remark === null) return;
  const res = await API.put(`/api/admin/claims/${cid}/audit`, { result, remark });
  showToast(res.msg, res.code === 200 ? "success" : "error");
  loadPending();
}

function auditWithReason(cid) { audit(cid, "拒绝"); }

document.addEventListener("DOMContentLoaded", () => {
  if (!API.user() || API.user().role !== "管理员") { window.location.href = "/login.html"; return; }
  loadPending();
});
</script>
</body>
</html>
