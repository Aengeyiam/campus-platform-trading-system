<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 举报管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 admin-sidebar p-3">
      <h5 class="mb-3">管理后台</h5>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/admin/statistics.html">数据统计</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/product_audit.html">商品审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/claim_audit.html">认领审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/user_manage.html">用户管理</a></li>
        <li class="nav-item"><a class="nav-link active" href="/admin/reports.html">举报管理</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/logs.html">审核日志</a></li>
        <li class="nav-item mt-3"><a class="nav-link text-danger" href="/index.html">返回前台</a></li>
      </ul>
    </div>

    <div class="col-md-10 p-4">
      <h4 class="page-header">举报管理</h4>

      <div class="btn-group btn-group-sm mb-3" id="statusFilter">
        <button class="btn btn-outline-secondary active" data-status="">全部</button>
        <button class="btn btn-outline-warning" data-status="待处理">待处理</button>
        <button class="btn btn-outline-danger" data-status="已处理">已处理</button>
        <button class="btn btn-outline-secondary" data-status="已驳回">已驳回</button>
      </div>

      <div id="reportList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let currentStatus = "";

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function loadReports() {
  const params = {};
  if (currentStatus) params.status = currentStatus;
  const res = await API.get("/api/admin/reports", params);
  const container = document.getElementById("reportList");

  if (res.code !== 200) {
    container.innerHTML = `<div class="empty-state">加载失败：${res.msg || "请稍后重试"}</div>`;
    return;
  }
  if (!res.data.length) {
    container.innerHTML = '<div class="empty-state">暂无举报记录</div>';
    return;
  }

  container.innerHTML = res.data.map(r => {
    const statusBadge = r.status === "待处理" ? "bg-warning text-dark"
      : r.status === "已处理" ? "bg-danger" : "bg-secondary";
    const pending = r.status === "待处理";
    return `
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <span class="badge ${statusBadge} me-2">${escapeHtml(r.status)}</span>
            <span class="badge bg-info me-2">${escapeHtml(r.reported_type)}</span>
            <span class="text-muted small">#${r.report_id}</span>
          </div>
          <small class="text-muted">${new Date(r.created_at).toLocaleString()}</small>
        </div>

        <div class="mt-2">
          <div class="fw-semibold">
            被举报对象：
            <a href="${r.reported_type === '商品' ? `/product_detail.html?id=${r.reported_id}` : `/user_profile.html?id=${r.reported_id}`}" class="seller-link">
              ${escapeHtml(r.target_name || `#${r.reported_id}`)}
            </a>
            ${r.target_owner_name ? `<span class="text-muted small ms-1">（发布者：${escapeHtml(r.target_owner_name)}）</span>` : ''}
          </div>
          <div class="text-secondary small mt-1">举报人：${escapeHtml(r.reporter_name)}</div>
          <div class="mt-2 p-2 rounded" style="background:#FFF6F0">${escapeHtml(r.reason)}</div>
          ${r.handle_result ? `<div class="text-muted small mt-2">处理结果：${escapeHtml(r.handle_result)} · ${escapeHtml(r.handler_name || '')} · ${r.handle_time ? new Date(r.handle_time).toLocaleString() : ''}</div>` : ''}
        </div>

        ${pending ? `
        <div class="mt-3 d-flex gap-2 justify-content-end">
          <button class="btn btn-success btn-sm" onclick="handleReport(${r.report_id}, '已处理')">核实违规（扣10分）</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="handleReport(${r.report_id}, '已驳回')">驳回举报</button>
        </div>` : ''}
      </div>
    </div>`;
  }).join("");
}

async function handleReport(rid, result) {
  let handle_result = "";
  if (result === "已处理") {
    handle_result = window.prompt("处理备注（选填）：") ?? "";
    if (handle_result === null) return;
  }
  const res = await API.put(`/api/admin/reports/${rid}/handle`, { result, handle_result });
  showToast(res.msg, res.code === 200 ? "success" : "error");
  if (res.code === 200) loadReports();
}

document.querySelectorAll("#statusFilter button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#statusFilter button").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    currentStatus = btn.dataset.status;
    loadReports();
  });
});

document.addEventListener("DOMContentLoaded", () => {
  if (!API.user() || API.user().role !== "管理员") {
    window.location.href = "/login.html";
    return;
  }
  loadReports();
});
</script>
</body>
</html>
