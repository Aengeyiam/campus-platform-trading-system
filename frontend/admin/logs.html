<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 审核日志</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div class="container-fluid"><div class="row">
<div class="col-md-2 admin-sidebar p-3">
  <h5 class="mb-3">管理后台</h5>
  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="/admin/statistics.html">数据统计</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/product_audit.html">商品审核</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/claim_audit.html">认领审核</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/user_manage.html">用户管理</a></li>
    <li class="nav-item"><a class="nav-link active" href="/admin/logs.html">审核日志</a></li>
    <li class="nav-item mt-3"><a class="nav-link text-danger" href="/index.html">返回前台</a></li>
  </ul>
</div>
<div class="col-md-10 p-4">
  <h4 class="page-header">审核日志</h4>
  <select class="form-select form-select-sm w-auto mb-3" id="typeFilter" onchange="loadLogs()">
    <option value="">全部类型</option>
    <option>商品审核</option><option>认领审核</option><option>举报处理</option><option>用户管理</option>
  </select>
  <div class="table-responsive">
    <table class="table table-hover table-sm" id="logTable">
      <thead><tr><th>ID</th><th>审核人</th><th>类型</th><th>对象ID</th><th>结果</th><th>备注</th><th>时间</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadLogs() {
  const type = document.getElementById("typeFilter").value;
  const params = {};
  if (type) params.type = type;
  const res = await API.get("/api/admin/logs", params);
  if (res.code !== 200) return;
  document.getElementById("logTable").querySelector("tbody").innerHTML = (res.data.items||[]).map(l => `
    <tr>
      <td>${l.log_id}</td><td>${l.auditor_name}</td><td>${l.audit_type}</td><td>${l.target_id}</td>
      <td><span class="badge ${l.result==='通过'?'bg-success':l.result==='驳回'||l.result==='拒绝'?'bg-danger':'bg-secondary'}">${l.result}</span></td>
      <td>${l.remark||'-'}</td><td>${new Date(l.created_at).toLocaleString()}</td>
    </tr>
  `).join("");
}

document.addEventListener("DOMContentLoaded", () => {
  if (!API.user() || API.user().role !== "管理员") { window.location.href = "/login.html"; return; }
  loadLogs();
});
</script>
</body>
</html>
