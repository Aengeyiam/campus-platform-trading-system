<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 用户管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div class="container-fluid"><div class="row">
<div class="col-md-2 admin-sidebar p-3">
  <h5 class="mb-3">管理后台</h5>
  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="/admin/statistics.html">数据统计</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/product_audit.html">商品审核</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/claim_audit.html">认领审核</a></li>
    <li class="nav-item"><a class="nav-link active" href="/admin/user_manage.html">用户管理</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/reports.html">举报管理</a></li>
    <li class="nav-item"><a class="nav-link" href="/admin/logs.html">审核日志</a></li>
    <li class="nav-item mt-3"><a class="nav-link text-danger" href="/index.html">返回前台</a></li>
  </ul>
</div>
<div class="col-md-10 p-4">
  <h4 class="page-header">用户管理</h4>
  <div class="table-responsive">
    <table class="table table-hover" id="userTable">
      <thead><tr><th>ID</th><th>学号</th><th>姓名</th><th>手机</th><th>角色</th><th>信用分</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadUsers() {
  const res = await API.get("/api/admin/users");
  if (res.code !== 200) return;
  document.getElementById("userTable").querySelector("tbody").innerHTML = res.data.map(u => `
    <tr>
      <td>${u.user_id}</td><td>${u.student_id}</td><td>${u.user_name}</td><td>${u.phone||'-'}</td>
      <td>${u.role_name}</td><td>${u.credit_score}</td>
      <td><span class="badge ${u.status===0?'bg-success':'bg-danger'}">${u.status===0?'启用':'禁用'}</span></td>
      <td>${new Date(u.created_at).toLocaleDateString()}</td>
      <td>
        <button class="btn btn-sm ${u.status===0?'btn-outline-danger':'btn-outline-success'}" onclick="toggleUser(${u.user_id}, ${u.status===0?1:0})">
          ${u.status===0?'禁用':'启用'}
        </button>
      </td>
    </tr>
  `).join("");
}

async function toggleUser(uid, newStatus) {
  const res = await API.put(`/api/admin/users/${uid}/status`, { status: newStatus });
  showToast(res.msg, res.code === 200 ? "success" : "error");
  loadUsers();
}

document.addEventListener("DOMContentLoaded", () => {
  if (!API.user() || API.user().role !== "管理员") { window.location.href = "/login.html"; return; }
  loadUsers();
});
</script>
</body>
</html>
