<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 商品审核</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 admin-sidebar p-3">
      <h5 class="mb-3">管理后台</h5>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/admin/statistics.html">数据统计</a></li>
        <li class="nav-item"><a class="nav-link active" href="/admin/product_audit.html">商品审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/claim_audit.html">认领审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/user_manage.html">用户管理</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/logs.html">审核日志</a></li>
        <li class="nav-item mt-3"><a class="nav-link text-danger" href="/index.html">返回前台</a></li>
      </ul>
    </div>

    <div class="col-md-10 p-4">
      <h4 class="page-header">商品审核</h4>
      <div id="pendingList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadPending() {
  const res = await API.get("/api/admin/products/pending");
  const container = document.getElementById("pendingList");
  if (res.code !== 200 || !res.data.length) {
    container.innerHTML = '<div class="empty-state">暂无待审核商品</div>';
    return;
  }

  container.innerHTML = res.data.map(p => `
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row">
          <div class="col-md-2">
            ${p.cover_image ? `<img src="${p.cover_image}" class="img-fluid rounded" style="max-height:120px">` : '<div class="bg-light rounded d-flex align-items-center justify-content-center" style="height:120px">无图片</div>'}
          </div>
          <div class="col-md-8">
            <h5>${p.title}</h5>
            <p class="text-muted">${p.description}</p>
            <div>
              <span class="badge bg-info me-1">${p.category_name}</span>
              <span class="badge bg-secondary me-1">${p.condition}</span>
              <span class="text-danger fw-bold">¥${Number(p.price).toFixed(2)}</span>
              <span class="ms-2 text-muted">发布者: ${p.seller_name}</span>
              <span class="ms-2 text-muted">${new Date(p.created_at).toLocaleString()}</span>
            </div>
          </div>
          <div class="col-md-2 d-flex flex-column justify-content-center gap-2">
            <button class="btn btn-success btn-sm" onclick="audit(${p.product_id}, '通过')">通过</button>
            <button class="btn btn-danger btn-sm" onclick="auditWithReason(${p.product_id})">驳回</button>
          </div>
        </div>
      </div>
    </div>
  `).join("");
}

async function audit(pid, result) {
  const res = await API.put(`/api/admin/products/${pid}/audit`, { result });
  showToast(res.msg, res.code === 200 ? "success" : "error");
  loadPending();
}

function auditWithReason(pid) {
  const remark = prompt("驳回原因：");
  if (remark === null) return;
  API.put(`/api/admin/products/${pid}/audit`, { result: "驳回", remark }).then(res => {
    showToast(res.msg, res.code === 200 ? "success" : "error");
    loadPending();
  });
}

document.addEventListener("DOMContentLoaded", () => {
  if (!API.user() || API.user().role !== "管理员") {
    window.location.href = "/login.html";
    return;
  }
  loadPending();
});
</script>
</body>
</html>
