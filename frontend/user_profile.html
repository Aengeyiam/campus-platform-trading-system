<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户主页 - 校园集市</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<style>
  /* 用户主页专属样式 */
  .user-hero { border-radius: 24px; background: linear-gradient(135deg, #FFFDFB, #FFF6F0); }
  .avatar {
    width: 72px; height: 72px; border-radius: 22px;
    background: var(--grad-brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 800; flex-shrink: 0;
    box-shadow: var(--shadow-md);
  }
  .credit-ring {
    text-align: center; padding: 10px 22px; border-radius: 20px;
    background: var(--brand-soft); flex-shrink: 0;
  }
  .credit-ring .num {
    font-size: 2.4rem; font-weight: 800; line-height: 1;
    background: var(--grad-brand);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .credit-ring .lbl { font-size: 0.78rem; color: var(--ink-soft); font-weight: 600; }
  .star-row { color: #FFB85C; font-size: 1.05rem; letter-spacing: 2px; }
  .star-row .off { color: #EADCCE; }
  .review-item + .review-item { border-top: 1px dashed var(--line); }
  .report-item + .report-item { border-top: 1px dashed var(--line); }
</style>
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4" style="max-width:860px">
  <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm mb-3">&larr; 返回</a>

  <!-- 用户信息头部 -->
  <div class="user-hero card mb-4" id="userHero">
    <div class="card-body text-center py-4 text-muted">加载中...</div>
  </div>

  <!-- 统计卡片 -->
  <div class="row g-3 mb-4" id="statCards"></div>

  <!-- TA 的商品 -->
  <div class="card mb-4" id="productCard" style="display:none">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>TA 的商品</span>
      <span class="text-muted small" id="productCount"></span>
    </div>
    <div class="card-body">
      <div class="row row-cols-2 row-cols-md-4 g-3" id="productList"></div>
    </div>
  </div>

  <!-- 最近评价 -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>最近评价</span>
      <span class="text-muted small" id="reviewCount"></span>
    </div>
    <div class="card-body" id="reviewList"><div class="text-muted text-center py-4">加载中...</div></div>
  </div>

  <!-- 被举报核实记录 -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>被举报核实记录</span>
      <span class="text-muted small" id="reportCount"></span>
    </div>
    <div class="card-body" id="reportList"><div class="text-muted text-center py-4">加载中...</div></div>
  </div>
</div>

<!-- 举报弹窗 -->
<div class="modal fade" id="reportModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">举报该用户</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="text-muted small mb-3">请如实填写举报理由，管理员审核通过后会做相应处理。</div>
        <label class="form-label">举报理由 <span class="text-danger">*</span></label>
        <textarea id="reportReason" class="form-control" rows="4" maxlength="500" placeholder="例如：恶意违约、发布虚假信息等"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger" onclick="submitReport()">提交举报</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function starRow(rating) {
  let s = "";
  for (let i = 1; i <= 5; i++) {
    s += `<span class="${i <= rating ? '' : 'off'}">★</span>`;
  }
  return `<span class="star-row">${s}</span>`;
}

async function loadProfile() {
  const params = new URLSearchParams(window.location.search);
  const uid = params.get("id");
  if (!uid) {
    document.getElementById("userHero").innerHTML = '<div class="card-body text-center py-5 empty-state">缺少用户参数</div>';
    return;
  }

  const res = await API.get(`/api/users/${uid}`);
  if (res.code !== 200) {
    document.getElementById("userHero").innerHTML = `<div class="card-body text-center py-5 empty-state">${res.msg || "用户不存在"}</div>`;
    document.getElementById("statCards").innerHTML = "";
    document.getElementById("reviewList").innerHTML = "";
    document.getElementById("reportList").innerHTML = "";
    return;
  }

  const u = res.data;
  const initial = (u.user_name || "?").charAt(0);
  const me = API.user();
  const isSelf = me && Number(me.user_id) === Number(uid);

  // 头部
  document.getElementById("userHero").innerHTML = `
    <div class="card-body d-flex flex-wrap align-items-center gap-3">
      <div class="avatar">${escapeHtml(initial)}</div>
      <div class="flex-grow-1">
        <h3 class="mb-1 fw-bold">${escapeHtml(u.user_name)}</h3>
        <div class="text-muted small">
          ${u.nickname && u.nickname !== u.user_name ? `昵称 ${escapeHtml(u.nickname)} · ` : ''}
          学号 ${escapeHtml(u.student_id)}
        </div>
        <div class="text-muted small">加入于 ${u.created_at ? new Date(u.created_at).toLocaleDateString() : '-'}</div>
      </div>
      <div class="d-flex flex-column align-items-center gap-2">
        <div class="credit-ring">
          <div class="num">${u.credit_score}</div>
          <div class="lbl">信用分</div>
        </div>
        ${!isSelf ? `<button class="btn btn-outline-danger btn-sm" onclick="openReport(${u.user_id})">🚩 举报该用户</button>` : ''}
      </div>
    </div>`;

  // 统计卡片
  const s = u.stats;
  const goodRate = s.review_count ? Math.round(s.good_count / s.review_count * 100) : null;
  const cards = [
    { label: "在售商品", value: s.on_sale },
    { label: "已售商品", value: s.sold },
    { label: "失物信息", value: s.lostfound },
    { label: "收到评价", value: s.review_count, sub: s.avg_rating != null ? `平均 ${s.avg_rating} 分` : "暂无" },
    { label: "好评率", value: goodRate != null ? goodRate + "%" : "—" },
    { label: "被举报核实", value: s.report_count },
  ];
  document.getElementById("statCards").innerHTML = cards.map(c => `
    <div class="col-6 col-md-4">
      <div class="stat-card h-100">
        <div class="text-muted small">${c.label}</div>
        <div class="fs-4 fw-bold">${c.value}</div>
        ${c.sub ? `<div class="text-muted small">${c.sub}</div>` : ''}
      </div>
    </div>`).join("");

  // TA 的商品（在售 + 已售出）
  const pc = document.getElementById("productCard");
  if (u.products && u.products.length > 0) {
    pc.style.display = "";
    const soldCount = u.products.filter(p => p.status === '已售出').length;
    document.getElementById("productCount").textContent = `在售 ${u.products.length - soldCount} · 已售 ${soldCount}`;
    document.getElementById("productList").innerHTML = u.products.map(p => {
      const sold = p.status === '已售出';
      return `
      <div class="col">
        <a href="/product_detail.html?id=${p.product_id}" class="text-decoration-none">
          <div class="card h-100 product-card" style="${sold ? 'opacity:0.72' : ''}">
            ${p.cover_image ? `<img src="${escapeHtml(p.cover_image)}" class="card-img-top" style="height:130px;object-fit:cover;${sold ? 'filter:grayscale(0.9)' : ''}" alt="${escapeHtml(p.title)}">` : `<div class="card-img-top bg-light d-flex align-items-center justify-content-center text-muted" style="height:130px">暂无图片</div>`}
            <div class="card-body p-2">
              <div class="text-truncate text-dark fw-semibold small">${escapeHtml(p.title)}</div>
              <div class="d-flex justify-content-between align-items-center mt-1">
                <span class="price-tag small">¥${Number(p.price).toFixed(2)}</span>
                ${sold ? '<span class="badge bg-secondary" style="font-size:10px">已售出</span>' : '<span class="badge bg-success" style="font-size:10px">在售</span>'}
              </div>
            </div>
          </div>
        </a>
      </div>`;
    }).join("");
  } else {
    pc.style.display = "none";
  }

  // 最近评价
  document.getElementById("reviewCount").textContent = s.review_count ? `共 ${s.review_count} 条` : "";
  const rl = document.getElementById("reviewList");
  if (u.reviews.length === 0) {
    rl.innerHTML = '<div class="text-muted text-center py-4">暂无评价</div>';
  } else {
    rl.innerHTML = u.reviews.map(r => `
      <div class="review-item py-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <div>
            ${starRow(r.rating)}
            <span class="ms-2 fw-semibold">${escapeHtml(r.reviewer_name)}</span>
          </div>
          <small class="text-muted">${new Date(r.created_at).toLocaleString()}</small>
        </div>
        ${r.comment ? `<div class="text-secondary small mb-2">${escapeHtml(r.comment)}</div>` : ''}
        ${r.product_id ? `
        <a href="/product_detail.html?id=${r.product_id}" class="text-decoration-none">
          <div class="d-flex align-items-center gap-2 p-2 rounded" style="background:#FFF6F0">
            ${r.cover_image ? `<img src="${escapeHtml(r.cover_image)}" width="36" height="36" style="object-fit:cover" class="rounded">` : ''}
            <span class="text-muted small">评价商品：<span class="text-dark fw-semibold">${escapeHtml(r.product_title || `#${r.product_id}`)}</span></span>
          </div>
        </a>` : ''}
      </div>`).join("");
  }

  // 被举报核实记录
  document.getElementById("reportCount").textContent = s.report_count ? `共 ${s.report_count} 条` : "";
  const rp = document.getElementById("reportList");
  if (u.reports.length === 0) {
    rp.innerHTML = '<div class="text-center py-4"><div class="fs-4">✅</div><div class="text-success fw-semibold mt-1">无违规记录，信用良好</div></div>';
  } else {
    rp.innerHTML = u.reports.map(r => {
      const isProduct = r.reported_type === '商品';
      const productBlock = isProduct ? `
        <a href="/product_detail.html?id=${r.reported_id}" class="text-decoration-none">
          <div class="d-flex align-items-center gap-2 mt-2 p-2 rounded" style="background:#FFF6F0">
            ${r.cover_image ? `<img src="${escapeHtml(r.cover_image)}" width="40" height="40" style="object-fit:cover" class="rounded">` : ''}
            <span class="text-dark small fw-semibold">${escapeHtml(r.target_name || `商品 #${r.reported_id}`)}</span>
          </div>
        </a>` : '';
      return `
        <div class="report-item py-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <div>
              <span class="badge bg-secondary me-2">${escapeHtml(r.reported_type)}</span>
              <span class="badge bg-danger">核实违规</span>
            </div>
            <small class="text-muted">${r.handle_time ? new Date(r.handle_time).toLocaleString() : ''}</small>
          </div>
          ${r.reason ? `<div class="text-secondary small">${escapeHtml(r.reason)}</div>` : ''}
          ${productBlock}
          ${r.handle_result ? `<div class="text-muted small mt-1">处理：${escapeHtml(r.handle_result)}</div>` : ''}
        </div>`;
    }).join("");
  }
}

document.addEventListener("DOMContentLoaded", loadProfile);

/* 举报用户 */
let reportTargetUid = null;

function openReport(uid) {
  if (!API.user()) { showToast("请先登录", "error"); setTimeout(() => window.location.href = "/login.html", 500); return; }
  reportTargetUid = uid;
  document.getElementById("reportReason").value = "";
  new bootstrap.Modal(document.getElementById("reportModal")).show();
}

async function submitReport() {
  const reason = document.getElementById("reportReason").value.trim();
  if (!reason) { showToast("请填写举报理由", "error"); return; }
  const res = await API.post("/api/reports", { reported_type: "用户", reported_id: reportTargetUid, reason });
  if (res.code === 200) {
    bootstrap.Modal.getInstance(document.getElementById("reportModal")).hide();
    showToast(res.msg || "举报已提交");
  } else {
    showToast(res.msg, "error");
  }
}
</script>
</body>
</html>
