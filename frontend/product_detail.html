<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品详情 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4">
  <a href="/index.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; 返回首页</a>
  <div id="detailContent">
    <div class="text-center py-5 text-muted">加载中...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const pid = params.get("id");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

async function loadDetail() {
  if (!pid) { document.getElementById("detailContent").innerHTML = '<div class="empty-state">商品不存在</div>'; return; }

  const res = await API.get(`/api/products/${pid}`);
  if (res.code !== 200) {
    document.getElementById("detailContent").innerHTML = `<div class="empty-state">${res.msg}</div>`;
    return;
  }

  const p = res.data;
  const user = API.user();
  const isOwner = p.is_owner === true || (user && user.user_id === p.seller_id);
  const canBuy = user && !isOwner && p.status === "已上架";

  let imagesHtml = '<div class="text-center bg-light rounded" style="height:320px;display:flex;align-items:center;justify-content:center"><span class="text-muted">暂无图片</span></div>';
  if (p.images && p.images.length > 0) {
    const mainImg = p.images[0].image_url;
    const thumbs = p.images.map((img, i) => `
      <img src="${escapeHtml(img.image_url)}" class="rounded border thumb-img ${i === 0 ? 'border-primary' : ''}"
           style="width:64px;height:64px;object-fit:cover;cursor:pointer"
           onclick="switchImage(this, '${encodeURIComponent(img.image_url)}')" alt="图片${i + 1}">`).join("");
    imagesHtml = `
      <img id="mainImage" src="${escapeHtml(mainImg)}" class="img-fluid rounded border" style="max-height:400px;width:100%;object-fit:contain" alt="${escapeHtml(p.title)}">
      ${p.images.length > 1 ? `<div class="d-flex flex-wrap gap-2 mt-2">${thumbs}</div>` : ''}`;
  }

  document.getElementById("detailContent").innerHTML = `
  <div class="row g-4">
    <div class="col-md-6">${imagesHtml}</div>
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3>${escapeHtml(p.title)}</h3>
          <span class="status-badge status-${escapeHtml(p.status)}">${escapeHtml(p.status)}</span>
          <hr>
          <h2 class="text-danger mb-3">¥${Number(p.price).toFixed(2)}</h2>
          ${p.original_price != null ? `<p class="text-muted text-decoration-line-through">原价 ¥${Number(p.original_price).toFixed(2)}</p>` : ''}
          <table class="table table-sm">
            <tr><td class="text-muted">分类</td><td>${escapeHtml(p.category_name || "")}</td></tr>
            <tr><td class="text-muted">新旧程度</td><td>${escapeHtml(p.condition || "")}</td></tr>
            <tr><td class="text-muted">浏览次数</td><td>${p.view_count}</td></tr>
            <tr><td class="text-muted">发布时间</td><td>${p.created_at ? new Date(p.created_at).toLocaleString() : ''}</td></tr>
          </table>
          <hr>
          <h6>商品描述</h6>
          <p>${escapeHtml(p.description).replace(/\n/g, "<br>")}</p>
          <hr>
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <strong>${escapeHtml(p.seller_name || "")}</strong>
              <span class="ms-2 text-success">信用分: ${p.seller_credit}</span>
            </div>
            <div class="d-flex gap-2">
              ${user && !isOwner ? `
                <button class="btn btn-outline-danger btn-lg" id="favBtn" onclick="toggleFavorite(${p.product_id})">
                  ${p.favorited ? '已收藏' : '收藏'}
                </button>` : ''}
              ${canBuy
                ? `<button class="btn btn-danger btn-lg" onclick="buyNow(${p.product_id})">立即购买</button>`
                : isOwner
                  ? `<button class="btn btn-outline-secondary" disabled>这是我的商品</button>`
                  : `<button class="btn btn-outline-secondary" disabled>${p.status === '已售出' ? '已售出' : '不可购买'}</button>`
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* 点击缩略图切换主图 */
function switchImage(el, encodedUrl) {
  const url = decodeURIComponent(encodedUrl);
  document.getElementById("mainImage").src = url;
  document.querySelectorAll(".thumb-img").forEach(t => t.classList.remove("border-primary"));
  el.classList.add("border-primary");
}

/* 收藏/取消收藏 */
async function toggleFavorite(product_id) {
  if (!API.user()) { showToast("请先登录", "error"); setTimeout(() => window.location.href="/login.html", 500); return; }
  const res = await API.post(`/api/products/${product_id}/favorite`);
  if (res.code === 200) {
    const btn = document.getElementById("favBtn");
    if (btn) {
      const nowFav = res.data ? res.data.favorited : false;
      btn.textContent = nowFav ? "已收藏" : "收藏";
    }
    showToast(res.msg || "操作成功");
  } else {
    showToast(res.msg, "error");
  }
}

async function buyNow(product_id) {
  if (!API.user()) { showToast("请先登录", "error"); setTimeout(() => window.location.href="/login.html", 500); return; }
  const res = await API.post("/api/orders", { product_id });
  if (res.code === 200) {
    showToast("下单成功！");
    setTimeout(() => window.location.href = "/my_orders.html", 800);
  } else {
    showToast(res.msg, "error");
  }
}

document.addEventListener("DOMContentLoaded", loadDetail);
</script>
</body>
</html>
