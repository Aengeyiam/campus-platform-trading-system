<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4" style="max-width:680px">
  <h4 class="page-header">个人中心</h4>

  <!-- 基本信息卡片 -->
  <div class="card shadow-sm mb-4" id="profileCard"></div>

  <!-- 信用记录 -->
  <div class="card shadow-sm">
    <div class="card-header fw-bold d-flex justify-content-between">
      <span>信用记录</span>
      <span class="text-success" id="creditScore"></span>
    </div>
    <div class="card-body" id="creditRecords"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
async function loadProfile() {
  if (!API.user()) { window.location.href = "/login.html"; return; }

  const res = await API.get("/api/auth/profile");
  if (res.code !== 200) return;
  const u = res.data;

  document.getElementById("profileCard").innerHTML = `
    <div class="card-body">
      <div class="row mb-2"><div class="col-3 text-muted">学号</div><div class="col-9">${u.student_id}</div></div>
      <div class="row mb-2"><div class="col-3 text-muted">姓名</div><div class="col-9">${u.user_name}</div></div>
      <div class="row mb-2"><div class="col-3 text-muted">昵称</div><div class="col-9"><span id="dispNickname">${u.nickname||'-'}</span></div></div>
      <div class="row mb-2"><div class="col-3 text-muted">手机</div><div class="col-9"><span id="dispPhone">${u.phone||'-'}</span></div></div>
      <div class="row mb-2"><div class="col-3 text-muted">QQ</div><div class="col-9"><span id="dispQQ">${u.qq||'-'}</span></div></div>
      <div class="row mb-2"><div class="col-3 text-muted">注册时间</div><div class="col-9">${new Date(u.created_at).toLocaleString()}</div></div>
      <button class="btn btn-outline-primary btn-sm mt-2" onclick="editProfile()">编辑资料</button>
    </div>`;

  document.getElementById("creditScore").textContent = `当前信用分: ${u.credit_score}`;

  // 信用记录
  const cr = await API.get("/api/auth/credit/records");
  const crDiv = document.getElementById("creditRecords");
  if (cr.code === 200 && cr.data.length) {
    crDiv.innerHTML = cr.data.map(r => `
      <div class="d-flex justify-content-between py-2 border-bottom">
        <div>
          <span class="badge ${r.change_value>=0?'bg-success':'bg-danger'} me-2">${r.change_value>=0?'+':''}${r.change_value}</span>
          ${r.change_type}
        </div>
        <small class="text-muted">${r.remark||''} · ${new Date(r.created_at).toLocaleString()}</small>
      </div>
    `).join("");
  } else {
    crDiv.innerHTML = '<div class="text-muted text-center py-3">暂无信用变动记录</div>';
  }
}

async function editProfile() {
  const nickname = prompt("昵称：", document.getElementById("dispNickname").textContent) || "";
  const phone = prompt("手机号：", document.getElementById("dispPhone").textContent) || "";
  const qq = prompt("QQ号：", document.getElementById("dispQQ").textContent) || "";
  const res = await API.put("/api/auth/profile", { nickname, phone, qq });
  showToast(res.msg, res.code === 200 ? "success" : "error");
  if (res.code === 200) loadProfile();
}

document.addEventListener("DOMContentLoaded", loadProfile);
</script>
</body>
</html>
