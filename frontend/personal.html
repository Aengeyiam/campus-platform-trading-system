<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 校园二手交易</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
<div id="campus-navbar"></div>

<div class="container mt-4" style="max-width:680px">
  <h4 class="page-header">个人中心</h4>

  <!-- 基本信息卡片 -->
  <div class="card shadow-sm mb-4" id="profileCard"></div>

  <!-- 信用记录 -->
  <div class="card shadow-sm mb-4">
    <div class="card-header fw-bold d-flex justify-content-between">
      <span>信用记录</span>
      <span class="text-success" id="creditScore"></span>
    </div>
    <div class="card-body" id="creditRecords"></div>
  </div>

  <!-- 我收到的评价 -->
  <div class="card shadow-sm mb-4">
    <div class="card-header fw-bold d-flex justify-content-between">
      <span>我收到的评价</span>
      <a href="#" id="myProfileLink" class="small">查看我的公开主页</a>
    </div>
    <div class="card-body" id="myReviews"><div class="text-muted text-center py-3">加载中...</div></div>
  </div>

  <!-- 我被举报核实记录 -->
  <div class="card shadow-sm">
    <div class="card-header fw-bold">我被举报核实记录</div>
    <div class="card-body" id="myReports"><div class="text-muted text-center py-3">加载中...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function starRow(rating) {
  let s = "";
  for (let i = 1; i <= 5; i++) {
    s += `<span style="color:${i <= rating ? '#FFB85C' : '#EADCCE'}">★</span>`;
  }
  return s;
}

async function loadProfile() {
  if (!API.user()) { window.location.href = "/login.html"; return; }

  const res = await API.get("/api/auth/profile");
  if (res.code !== 200) return;
  const u = res.data;

  document.getElementById("profileCard").innerHTML = `
    <div class="card-body">
      <div class="row mb-2"><div class="col-3 text-muted">学号</div><div class="col-9">${u.student_id}</div></div>
      <div class="row mb-2"><div class="col-3 text-muted">姓名</div><div class="col-9">${u.user_name}</div></div>
      <div class="row mb-2"><div class="col-3 text-muted">昵称</div><div class="col-9"><span id="dispNickname">${u.nickname||'-'}</span></div></div>
      <div class="row mb-2"><div class="col-3 text-muted">手机</div><div class="col-9"><span id="dispPhone">${u.phone||'-'}</span></div></div>
      <div class="row mb-2"><div class="col-3 text-muted">QQ</div><div class="col-9"><span id="dispQQ">${u.qq||'-'}</span></div></div>
      <div class="row mb-2"><div class="col-3 text-muted">注册时间</div><div class="col-9">${new Date(u.created_at).toLocaleString()}</div></div>
      <button class="btn btn-outline-primary btn-sm mt-2" onclick="editProfile()">编辑资料</button>
    </div>`;

  document.getElementById("creditScore").textContent = `当前信用分: ${u.credit_score}`;

  // 信用记录
  const cr = await API.get("/api/auth/credit/records");
  const crDiv = document.getElementById("creditRecords");
  if (cr.code === 200 && cr.data.length) {
    crDiv.innerHTML = cr.data.map(r => `
      <div class="d-flex justify-content-between py-2 border-bottom">
        <div>
          <span class="badge ${r.change_value>=0?'bg-success':'bg-danger'} me-2">${r.change_value>=0?'+':''}${r.change_value}</span>
          ${r.change_type}
        </div>
        <small class="text-muted">${r.remark||''} · ${new Date(r.created_at).toLocaleString()}</small>
      </div>
    `).join("");
  } else {
    crDiv.innerHTML = '<div class="text-muted text-center py-3">暂无信用变动记录</div>';
  }

  // 我收到的评价 + 被举报记录（复用公开主页接口）
  document.getElementById("myProfileLink").href = `/user_profile.html?id=${u.user_id}`;
  const pub = await API.get(`/api/users/${u.user_id}`);
  if (pub.code === 200) {
    const d = pub.data;

    const rvDiv = document.getElementById("myReviews");
    if (d.reviews.length) {
      rvDiv.innerHTML = d.reviews.map(r => `
        <div class="py-2 border-bottom">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <div>${starRow(r.rating)} <span class="fw-semibold ms-1">${escapeHtml(r.reviewer_name)}</span></div>
            <small class="text-muted">${new Date(r.created_at).toLocaleString()}</small>
          </div>
          ${r.comment ? `<div class="text-secondary small mb-2">${escapeHtml(r.comment)}</div>` : ''}
          ${r.product_id ? `
          <a href="/product_detail.html?id=${r.product_id}" class="text-decoration-none">
            <div class="d-flex align-items-center gap-2 p-2 rounded" style="background:#FFF6F0">
              ${r.cover_image ? `<img src="${escapeHtml(r.cover_image)}" width="36" height="36" style="object-fit:cover" class="rounded">` : ''}
              <span class="text-muted small">商品：<span class="text-dark fw-semibold">${escapeHtml(r.product_title || `#${r.product_id}`)}</span></span>
            </div>
          </a>` : ''}
        </div>`).join("");
    } else {
      rvDiv.innerHTML = '<div class="text-muted text-center py-3">暂无评价</div>';
    }

    const rpDiv = document.getElementById("myReports");
    if (d.reports.length) {
      rpDiv.innerHTML = d.reports.map(r => {
        const isProduct = r.reported_type === '商品';
        const productBlock = isProduct ? `
          <a href="/product_detail.html?id=${r.reported_id}" class="text-decoration-none">
            <div class="d-flex align-items-center gap-2 mt-2 p-2 rounded" style="background:#FFF6F0">
              ${r.cover_image ? `<img src="${escapeHtml(r.cover_image)}" width="36" height="36" style="object-fit:cover" class="rounded">` : ''}
              <span class="text-dark small fw-semibold">${escapeHtml(r.target_name || `商品 #${r.reported_id}`)}</span>
            </div>
          </a>` : '';
        return `
          <div class="py-2 border-bottom">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <div><span class="badge bg-secondary me-1">${escapeHtml(r.reported_type)}</span><span class="badge bg-danger">核实违规</span></div>
              <small class="text-muted">${r.handle_time ? new Date(r.handle_time).toLocaleString() : ''}</small>
            </div>
            ${r.reason ? `<div class="text-secondary small">${escapeHtml(r.reason)}</div>` : ''}
            ${productBlock}
          </div>`;
      }).join("");
    } else {
      rpDiv.innerHTML = '<div class="text-center py-3 text-success">✅ 无违规记录，信用良好</div>';
    }
  }
}

async function editProfile() {
  const nickname = prompt("昵称：", document.getElementById("dispNickname").textContent) || "";
  const phone = prompt("手机号：", document.getElementById("dispPhone").textContent) || "";
  const qq = prompt("QQ号：", document.getElementById("dispQQ").textContent) || "";
  const res = await API.put("/api/auth/profile", { nickname, phone, qq });
  showToast(res.msg, res.code === 200 ? "success" : "error");
  if (res.code === 200) loadProfile();
}

document.addEventListener("DOMContentLoaded", loadProfile);
</script>
</body>
</html>
